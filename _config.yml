assessoria:
  - nome: Inspeção Predial
    texto: Avaliação de todos os sistemas da edificação, com as anomalias classificadas por grau de risco e uma lista clara de prioridades.
    entrega: Laudo com ART e plano de prioridades
  - nome: Inspeção de Fachadas
    texto: Mapeamento do revestimento pano a pano, com acesso por alpinismo industrial e ensaio de percussão.
    entrega: Laudo com mapeamento das anomalias
  - nome: Fiscalização de Obras
    texto: Um engenheiro do lado do condomínio, conferindo qualidade, prazos e medições antes de cada pagamento.
    entrega: Relatório a cada visita
  - nome: Projeto AVCB
    texto: Projeto de segurança contra incêndio e acompanhamento do processo no Corpo de Bombeiros até a emissão do AVCB.
    entrega: Projeto e acompanhamento no CBM-BA
  - nome: Laudo de SPDA
    texto: Inspeção do para-raios com medições de continuidade e de resistência de aterramento.
    entrega: Laudo com medições e ART
  - nome: Carregadores de veículos elétricos
    texto: Análise da capacidade elétrica e das condições da garagem para a instalação de carregadores pelos condôminos.
    entrega: Laudo de viabilidade e regras para a assembleia

